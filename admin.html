<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elara Admin</title>
<style>
:root{
  --bg:#0F0E0C;--surface:#171614;--surface2:#1E1C1A;
  --text:#F0EDE7;--muted:#6A6560;--accent:#A8806E;--gold:#C9A86C;
  --rule:#252320;--red:#C0504A;--green:#5A9E6F;
  --serif:Didot,"Bodoni MT","Playfair Display",Georgia,serif;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-size:15px;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;height:100vh;overflow:hidden;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;border:none;font-family:inherit;}

/* ── Login ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:100;
}
.login-box{width:340px;}
.login-logo{
  font-family:var(--serif);font-size:1.4rem;letter-spacing:.25em;
  text-transform:uppercase;margin-bottom:48px;color:var(--text);
}
.login-box label{
  display:block;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.login-box input{
  width:100%;background:transparent;border:none;border-bottom:.5px solid var(--rule);
  padding:10px 0 12px;color:var(--text);font-family:var(--sans);font-size:.9rem;
  outline:none;margin-bottom:28px;transition:border-color .2s;
}
.login-box input:focus{border-bottom-color:var(--accent);}
.login-btn{
  width:100%;padding:14px;background:var(--text);color:var(--bg);
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  transition:opacity .2s;
}
.login-btn:hover{opacity:.8;}
.login-err{font-size:.75rem;color:var(--red);margin-top:14px;min-height:20px;}

/* ── Sidebar ── */
.sidebar{
  width:220px;flex-shrink:0;background:var(--surface);
  display:flex;flex-direction:column;padding:28px 0;
  border-right:.5px solid var(--rule);
}
.sidebar-logo{
  font-family:var(--serif);font-size:.9rem;letter-spacing:.25em;
  text-transform:uppercase;color:var(--muted);
  padding:0 24px 32px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 24px;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);cursor:pointer;
  transition:all .15s;border-left:2px solid transparent;
}
.nav-item:hover{color:var(--text);background:var(--surface2);}
.nav-item.active{color:var(--text);border-left-color:var(--accent);}
.nav-icon{font-size:1rem;width:20px;text-align:center;}
.sidebar-footer{
  margin-top:auto;padding:0 24px;
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
}
.logout-btn{
  display:block;margin-top:12px;color:var(--muted);font-size:.65rem;
  letter-spacing:.14em;text-transform:uppercase;transition:color .2s;
  background:none;border:none;cursor:pointer;font-family:var(--sans);padding:0;
}
.logout-btn:hover{color:var(--red);}

/* ── Main ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{
  padding:20px 32px;border-bottom:.5px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.page-title{font-family:var(--serif);font-size:1.4rem;font-weight:300;}
.content{padding:32px;}

/* ── Stats cards ── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px;}
.stat-card{
  background:var(--surface);padding:20px;border:.5px solid var(--rule);
}
.stat-label{font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.stat-val{font-family:var(--serif);font-size:2rem;font-weight:300;color:var(--text);line-height:1;}
.stat-val.gold{color:var(--gold);}

/* ── Tables ── */
.table-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
}
.table-header h3{font-family:var(--serif);font-size:1.1rem;font-weight:300;}
.add-btn{
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 18px;border:.5px solid var(--rule);color:var(--muted);
  background:transparent;transition:all .2s;
}
.add-btn:hover{color:var(--text);border-color:var(--text);}

table{width:100%;border-collapse:collapse;font-size:.8rem;}
th{
  text-align:left;padding:10px 14px;font-size:.58rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);border-bottom:.5px solid var(--rule);
  font-weight:400;
}
td{padding:12px 14px;border-bottom:.5px solid var(--rule);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}

.tier-pill{
  font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border:.5px solid var(--rule);color:var(--muted);
}
.tier-pill.vip{color:var(--gold);border-color:var(--gold);}
.tier-pill.sponsored{color:var(--accent);border-color:var(--accent);}

.action-btns{display:flex;gap:8px;}
.action-btn{
  font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border:.5px solid var(--rule);color:var(--muted);
  background:transparent;transition:all .15s;
}
.action-btn:hover{color:var(--text);border-color:var(--muted);}
.action-btn.danger:hover{color:var(--red);border-color:var(--red);}

/* ── Modal ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}
.modal{
  background:var(--surface);width:520px;max-width:calc(100vw - 32px);
  max-height:90vh;overflow-y:auto;padding:36px;position:relative;
}
.modal-title{font-family:var(--serif);font-size:1.3rem;font-weight:300;margin-bottom:28px;}
.modal-close{
  position:absolute;top:16px;right:16px;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);background:none;border:none;
  cursor:pointer;transition:color .2s;
}
.modal-close:hover{color:var(--text);}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;}
.form-group{margin-bottom:22px;}
.form-group label{
  display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;
}
.form-group input,.form-group select,.form-group textarea{
  width:100%;background:transparent;border:none;border-bottom:.5px solid var(--rule);
  padding:8px 0 10px;color:var(--text);font-family:var(--sans);font-size:.85rem;
  outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-bottom-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:80px;}
.form-group select option{background:var(--surface);color:var(--text);}

.checkbox-group{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.checkbox-group input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.checkbox-group label{font-size:.75rem;color:var(--muted);letter-spacing:.04em;}

.form-actions{display:flex;gap:10px;margin-top:8px;}
.save-btn{
  padding:11px 24px;background:var(--text);color:var(--bg);
  font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;transition:opacity .2s;
}
.save-btn:hover{opacity:.8;}
.cancel-btn{
  padding:11px 24px;border:.5px solid var(--rule);color:var(--muted);
  font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
  background:transparent;transition:all .2s;
}
.cancel-btn:hover{color:var(--text);border-color:var(--text);}

/* ── Toast ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--surface);border:.5px solid var(--rule);
  padding:12px 20px;font-size:.72rem;color:var(--text);
  opacity:0;transform:translateY(8px);transition:all .25s;
  pointer-events:none;z-index:300;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}

.empty-state{
  padding:48px;text-align:center;color:var(--muted);font-size:.8rem;
}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <p class="login-logo">Elara</p>
    <div>
      <label>Kullanıcı Adı</label>
      <input id="l-user" type="text" placeholder="admin" autocomplete="username">
    </div>
    <div>
      <label>Şifre</label>
      <input id="l-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="login()">Giriş Yap</button>
    <p class="login-err" id="login-err"></p>
  </div>
</div>

<!-- App -->
<aside class="sidebar">
  <p class="sidebar-logo">Elara</p>
  <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
    <span class="nav-icon">◈</span> Dashboard
  </div>
  <div class="nav-item" onclick="showPage('profiles')" id="nav-profiles">
    <span class="nav-icon">◉</span> Profiller
  </div>
  <div class="nav-item" onclick="showPage('blog')" id="nav-blog">
    <span class="nav-icon">◎</span> Blog
  </div>
  <div class="sidebar-footer">
    <span id="admin-name"></span>
    <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <h1 class="page-title" id="page-title">Dashboard</h1>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- Profile Modal -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('profile-modal')">Kapat ✕</button>
    <h2 class="modal-title" id="pm-title">Yeni Profil</h2>
    <form id="profile-form" onsubmit="saveProfile(event)">
      <input type="hidden" id="pm-id">
      <div class="form-row">
        <div class="form-group">
          <label>İsim</label>
          <input id="pm-name" type="text" required placeholder="Sofia">
        </div>
        <div class="form-group">
          <label>Yaş</label>
          <input id="pm-age" type="number" min="18" max="60" required placeholder="25">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Şehir</label>
          <input id="pm-city" type="text" required placeholder="İstanbul">
        </div>
        <div class="form-group">
          <label>Kademe</label>
          <select id="pm-tier">
            <option value="standard">Standart</option>
            <option value="vip">VIP</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Diller</label>
        <input id="pm-languages" type="text" placeholder="Türkçe, İngilizce">
      </div>
      <div class="form-group">
        <label>Etiketler (virgülle)</label>
        <input id="pm-tags" type="text" placeholder="VIP, Sosyal, Seyahat">
      </div>
      <div class="form-group">
        <label>Renk Tonu (0-360)</label>
        <input id="pm-hue" type="number" min="0" max="360" placeholder="18">
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="pm-bio" placeholder="Kısa tanıtım metni…"></textarea>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="pm-sponsored">
        <label for="pm-sponsored">Sponsorlu (Öne Çıkanlar'da göster)</label>
      </div>
      <div class="form-actions">
        <button type="submit" class="save-btn">Kaydet</button>
        <button type="button" class="cancel-btn" onclick="closeModal('profile-modal')">İptal</button>
      </div>
    </form>
  </div>
</div>

<!-- Blog Modal -->
<div class="modal-overlay" id="blog-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('blog-modal')">Kapat ✕</button>
    <h2 class="modal-title" id="bm-title">Yeni Yazı</h2>
    <form id="blog-form" onsubmit="saveBlog(event)">
      <input type="hidden" id="bm-id">
      <div class="form-group">
        <label>Başlık</label>
        <input id="bm-title-input" type="text" required placeholder="Yazı başlığı">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <input id="bm-cat" type="text" placeholder="Seyahat / Rehber / VIP / Yaşam">
      </div>
      <div class="form-group">
        <label>Özet</label>
        <textarea id="bm-excerpt" placeholder="Kısa açıklama (liste görünümünde çıkar)"></textarea>
      </div>
      <div class="form-group">
        <label>İçerik</label>
        <textarea id="bm-content" style="min-height:140px" placeholder="Yazının tam içeriği…"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="save-btn">Kaydet</button>
        <button type="button" class="cancel-btn" onclick="closeModal('blog-modal')">İptal</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('elara_token');
let currentUser = localStorage.getItem('elara_user');

/* ── Auth ── */
async function login() {
  const username = document.getElementById('l-user').value.trim();
  const password = document.getElementById('l-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) return (err.textContent = data.error);
    token = data.token;
    currentUser = data.username;
    localStorage.setItem('elara_token', token);
    localStorage.setItem('elara_user', currentUser);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-name').textContent = currentUser;
    showPage('dashboard');
  } catch {
    err.textContent = 'Sunucuya bağlanılamadı.';
  }
}

function logout() {
  token = null; currentUser = null;
  localStorage.removeItem('elara_token');
  localStorage.removeItem('elara_user');
  document.getElementById('login-screen').style.display = 'flex';
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

/* ── Navigation ── */
function showPage(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-'+page).classList.add('active');
  if (page === 'dashboard') { document.getElementById('page-title').textContent = 'Dashboard'; loadDashboard(); }
  if (page === 'profiles')  { document.getElementById('page-title').textContent = 'Profiller'; loadProfiles(); }
  if (page === 'blog')      { document.getElementById('page-title').textContent = 'Blog Yazıları'; loadBlog(); }
}

/* ── Dashboard ── */
async function loadDashboard() {
  const el = document.getElementById('content');
  try {
    const res = await fetch(`${API}/api/stats`, { headers: { Authorization: `Bearer ${token}` } });
    const s = await res.json();
    el.innerHTML = `
      <div class="stats-row">
        <div class="stat-card"><p class="stat-label">Toplam Profil</p><p class="stat-val">${s.profiles}</p></div>
        <div class="stat-card"><p class="stat-label">VIP Profil</p><p class="stat-val gold">${s.vip}</p></div>
        <div class="stat-card"><p class="stat-label">Sponsorlu</p><p class="stat-val">${s.sponsored}</p></div>
        <div class="stat-card"><p class="stat-label">Blog Yazısı</p><p class="stat-val">${s.blog}</p></div>
      </div>
      <p style="font-size:.78rem;color:var(--muted);line-height:1.8;">
        Sol menüden <strong style="color:var(--text)">Profiller</strong> veya <strong style="color:var(--text)">Blog</strong> bölümüne geçerek içerik ekleyebilir, düzenleyebilir veya silebilirsiniz.<br>
        Sponsorlu profiller ana sayfanın <em>Öne Çıkanlar</em> bölümünde gösterilir.
      </p>
    `;
  } catch {
    el.innerHTML = '<p class="empty-state">Sunucuya bağlanılamadı.</p>';
  }
}

/* ── Profiles ── */
let profiles = [];
async function loadProfiles() {
  const el = document.getElementById('content');
  try {
    const res = await fetch(`${API}/api/profiles`);
    profiles = await res.json();
    renderProfiles();
  } catch {
    el.innerHTML = '<p class="empty-state">Profiller yüklenemedi.</p>';
  }
}

function renderProfiles() {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="table-header">
      <h3>Tüm Profiller (${profiles.length})</h3>
      <button class="add-btn" onclick="openProfileModal()">+ Yeni Profil</button>
    </div>
    <table>
      <thead><tr>
        <th>İsim</th><th>Yaş</th><th>Şehir</th><th>Kademe</th><th>Durum</th><th>İşlem</th>
      </tr></thead>
      <tbody>
        ${profiles.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>${p.age}</td>
            <td>${p.city}</td>
            <td>
              <span class="tier-pill ${p.tier==='vip'?'vip':''}">${p.tier==='vip'?'VIP':'Standart'}</span>
              ${p.sponsored ? '<span class="tier-pill sponsored" style="margin-left:4px">Sponsorlu</span>' : ''}
            </td>
            <td style="color:${p.active?'var(--green)':'var(--red)'}">${p.active?'Aktif':'Pasif'}</td>
            <td>
              <div class="action-btns">
                <button class="action-btn" onclick="openProfileModal(${p.id})">Düzenle</button>
                <button class="action-btn danger" onclick="deleteProfile(${p.id})">Sil</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openProfileModal(id) {
  const modal = document.getElementById('profile-modal');
  document.getElementById('pm-title').textContent = id ? 'Profili Düzenle' : 'Yeni Profil';
  if (id) {
    const p = profiles.find(x => x.id === id);
    if (!p) return;
    document.getElementById('pm-id').value = p.id;
    document.getElementById('pm-name').value = p.name;
    document.getElementById('pm-age').value = p.age;
    document.getElementById('pm-city').value = p.city;
    document.getElementById('pm-tier').value = p.tier;
    document.getElementById('pm-languages').value = p.languages || '';
    document.getElementById('pm-tags').value = p.tags || '';
    document.getElementById('pm-hue').value = p.hue || 18;
    document.getElementById('pm-bio').value = p.bio || '';
    document.getElementById('pm-sponsored').checked = !!p.sponsored;
  } else {
    document.getElementById('profile-form').reset();
    document.getElementById('pm-id').value = '';
  }
  modal.classList.add('open');
}

async function saveProfile(e) {
  e.preventDefault();
  const id = document.getElementById('pm-id').value;
  const body = {
    name:      document.getElementById('pm-name').value,
    age:       parseInt(document.getElementById('pm-age').value),
    city:      document.getElementById('pm-city').value,
    tier:      document.getElementById('pm-tier').value,
    languages: document.getElementById('pm-languages').value,
    tags:      document.getElementById('pm-tags').value,
    hue:       parseInt(document.getElementById('pm-hue').value)||18,
    bio:       document.getElementById('pm-bio').value,
    sponsored: document.getElementById('pm-sponsored').checked,
    active:    1,
  };
  const url = id ? `${API}/api/profiles/${id}` : `${API}/api/profiles`;
  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, { method, headers: {'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body: JSON.stringify(body) });
    if (!res.ok) throw new Error();
    closeModal('profile-modal');
    toast('Kaydedildi', 'success');
    loadProfiles();
  } catch {
    toast('Kayıt başarısız', 'error');
  }
}

async function deleteProfile(id) {
  if (!confirm('Bu profili silmek istediğinize emin misiniz?')) return;
  try {
    await fetch(`${API}/api/profiles/${id}`, { method:'DELETE', headers:{'Authorization':`Bearer ${token}`} });
    toast('Profil silindi', 'success');
    loadProfiles();
  } catch {
    toast('Hata', 'error');
  }
}

/* ── Blog ── */
let posts = [];
async function loadBlog() {
  const el = document.getElementById('content');
  try {
    const res = await fetch(`${API}/api/blog`);
    posts = await res.json();
    renderBlog();
  } catch {
    el.innerHTML = '<p class="empty-state">Blog yazıları yüklenemedi.</p>';
  }
}

function renderBlog() {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="table-header">
      <h3>Blog Yazıları (${posts.length})</h3>
      <button class="add-btn" onclick="openBlogModal()">+ Yeni Yazı</button>
    </div>
    <table>
      <thead><tr>
        <th>Başlık</th><th>Kategori</th><th>Tarih</th><th>İşlem</th>
      </tr></thead>
      <tbody>
        ${posts.map(p => `
          <tr>
            <td style="max-width:320px">${p.title}</td>
            <td><span class="tier-pill">${p.category||'—'}</span></td>
            <td style="color:var(--muted);font-size:.72rem">${p.published_at?.slice(0,10)||'—'}</td>
            <td>
              <div class="action-btns">
                <button class="action-btn" onclick="openBlogModal(${p.id})">Düzenle</button>
                <button class="action-btn danger" onclick="deleteBlog(${p.id})">Sil</button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openBlogModal(id) {
  const modal = document.getElementById('blog-modal');
  document.getElementById('bm-title').textContent = id ? 'Yazıyı Düzenle' : 'Yeni Yazı';
  if (id) {
    const p = posts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('bm-id').value = p.id;
    document.getElementById('bm-title-input').value = p.title;
    document.getElementById('bm-cat').value = p.category || '';
    document.getElementById('bm-excerpt').value = p.excerpt || '';
    document.getElementById('bm-content').value = p.content || '';
  } else {
    document.getElementById('blog-form').reset();
    document.getElementById('bm-id').value = '';
  }
  modal.classList.add('open');
}

async function saveBlog(e) {
  e.preventDefault();
  const id = document.getElementById('bm-id').value;
  const body = {
    title:    document.getElementById('bm-title-input').value,
    category: document.getElementById('bm-cat').value,
    excerpt:  document.getElementById('bm-excerpt').value,
    content:  document.getElementById('bm-content').value,
    active:   1,
  };
  const url = id ? `${API}/api/blog/${id}` : `${API}/api/blog`;
  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, { method, headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`}, body:JSON.stringify(body) });
    if (!res.ok) throw new Error();
    closeModal('blog-modal');
    toast('Kaydedildi', 'success');
    loadBlog();
  } catch {
    toast('Kayıt başarısız', 'error');
  }
}

async function deleteBlog(id) {
  if (!confirm('Bu yazıyı silmek istediğinize emin misiniz?')) return;
  try {
    await fetch(`${API}/api/blog/${id}`, { method:'DELETE', headers:{'Authorization':`Bearer ${token}`} });
    toast('Yazı silindi', 'success');
    loadBlog();
  } catch {
    toast('Hata', 'error');
  }
}

/* ── Helpers ── */
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

let toastTimer;
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ── Init ── */
if (token) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-name').textContent = currentUser;
  showPage('dashboard');
}
</script>
